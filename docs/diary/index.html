<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぼぎだぢ制作日記</title>
<!-- 読みこむ先を、このサイトの中だけに限る(外のサーバーに何も問い合わせない D301) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<style>
/* 字体はサイトの中に置いたもの(D301)。本文の明朝は、端末の明朝 */
@font-face { font-family: "DotGothic16"; font-display: swap; src: url("../../field/assets/font/DotGothic16-Regular.woff2") format("woff2"); }
:root {
  --bg: #f6f3ec; --fg: #2a2723; --muted: #6f685e; --line: #d9d2c4;
  --quote-bg: #ece6da; --accent: #8a4b2a; --win: #111; --win-fg: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --fg: #e8e3da; --muted: #a39c90; --line: #3a3631;
    --quote-bg: #26241f; --accent: #e0a070; --win: #000; --win-fg: #fff;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --fg: #e8e3da; --muted: #a39c90; --line: #3a3631;
  --quote-bg: #26241f; --accent: #e0a070; --win: #000; --win-fg: #fff;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; font-size: 17px; line-height: 1.95;
}
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 96px; }
h1, h2, h3, .toc a { font-family: "DotGothic16", sans-serif; font-weight: 400; }
h1 {
  font-size: 1.6rem; line-height: 1.5; margin: 0 0 1.2em; padding: 18px 20px;
  background: var(--win); color: var(--win-fg);
  border: 3px double var(--win-fg); outline: 3px solid var(--win);
}
h2 { font-size: 1.3rem; margin: 2.6em 0 .8em; padding-bottom: .3em; border-bottom: 2px solid var(--line); }
h2::before { content: "▶ "; color: var(--accent); }
p { margin: 0 0 1.2em; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px dashed var(--line); margin: 2.4em 0; }
blockquote {
  margin: 1.4em 0; padding: 14px 18px; background: var(--quote-bg);
  border-left: 4px solid var(--accent);
}
blockquote p { margin: 0 0 .4em; }
blockquote p:last-child { margin: 0; }
details { margin: 1.2em 0; padding: 12px 16px; border: 1px solid var(--line); background: var(--quote-bg); }
summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: .8em; }
img {
  display: block; max-width: 100%; height: auto; margin: 1.6em auto .4em;
  image-rendering: pixelated; border: 1px solid var(--line);
}
img + em, .strip + em, p > em:only-child { display: block; font-size: .88rem; color: var(--muted); text-align: center; }
ul { padding-left: 1.4em; }
li { margin: .3em 0; }
.strip { overflow-x: auto; margin: 1.6em 0 .4em; }
.strip img { margin: 0 auto; }
@media (max-width: 600px) {
  .strip img { max-width: none; height: 170px; width: auto; }
}
table { width: 100%; border-collapse: collapse; margin: 1.2em 0 1.6em; font-size: .92rem; line-height: 1.7; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { border-bottom: 2px solid var(--line); white-space: nowrap; }
td:first-child { white-space: nowrap; font-weight: 700; }
@media (max-width: 600px) { td:first-child { white-space: normal; min-width: 4.5em; } }
.toc { list-style: none; padding: 0; }
.toc li { margin: .8em 0; font-size: 1.1rem; }
.foot { margin-top: 4em; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main id="root"><p>読み込んでいます…</p></main>
<script src="marked.min.js"></script><!-- marked v12.0.2(MIT。marked.LICENSE.md) -->
<script src="diary.js"></script>
</body>
</html>
