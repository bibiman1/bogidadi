<text x="460.0" y="218.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">AI がマージのたびに上げる</text>
<line x1="242" y1="170" x2="328" y2="170" stroke="#2b2622" stroke-width="3" marker-end="url(#ah)"/>
<text x="285.0" y="158.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">build.py</text>
<text x="285" y="200" font-size="13" font-weight="normal" text-anchor="middle" fill="#8a8076" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">選んで作る</text>
