<text x="460.0" y="380" font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">zip(ゲームと書庫)</text>
<text x="460.0" y="408.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">build.py --freem</text>
<text x="460.0" y="428.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">開くとすぐゲーム</text>
<path d="M 130 312 L 130 410 L 326 410" fill="none" stroke="#2b2622" stroke-width="3" marker-end="url(#ah)"/>
