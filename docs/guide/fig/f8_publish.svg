<text x="725.0" y="148.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ゲームの外に 1 つ</text>
<line x1="592" y1="135" x2="636" y2="135" stroke="#2b2622" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="850" y="210" width="130" height="170" rx="10" fill="#e8a066" stroke="#2b2622" stroke-width="2.5"/>
