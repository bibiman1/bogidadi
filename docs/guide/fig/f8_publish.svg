<text x="915.0" y="268.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">スマホ</text>
<text x="915.0" y="288.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">パソコン</text>
<text x="915.0" y="308.6" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">登録なし</text>
<line x1="592" y1="220" x2="848" y2="260" stroke="#2b2622" stroke-width="3" marker-end="url(#ah)"/>
<line x1="812" y1="370" x2="848" y2="340" stroke="#2b2622" stroke-width="3" marker-end="url(#ah)"/>
<line x1="812" y1="480" x2="870" y2="382" stroke="#2b2622" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="570" width="960" height="75" rx="10" fill="#e4ddd2" stroke="#2b2622" stroke-width="2"/>
<text x="500" y="600.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">マージのたびに、AI が build.py で作り直して公開用に上げ、Pages の公開を見届ける(1 分ほど)</text>
<text x="500" y="621.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">投稿サイトの zip は自動では変わらない。大きく変えたら作者が上げなおす。登録と投稿は作者の手で</text>
