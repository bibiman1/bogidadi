<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="図8 公開の流れ"><title>図8 公開の流れ</title><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2b2622"/></marker></defs><rect width="1000" height="660" fill="#fbf8f2"/>
<text x="500" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">図8 公開の流れ。本拠地は 1 つ、投稿サイトは入口</text>
<rect x="20" y="110" width="220" height="200" rx="10" fill="#86b98f" stroke="#2b2622" stroke-width="2.5"/>
