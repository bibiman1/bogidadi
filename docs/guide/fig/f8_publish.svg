<text x="130.0" y="168.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">開発用のリポジトリ</text>
<text x="130.0" y="188.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">材料、没の絵</text>
<text x="130.0" y="208.6" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">テスト、作業ログ</text>
<text x="130.0" y="228.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">ここに残して出さない</text>
<rect x="330" y="100" width="260" height="170" rx="10" fill="#86b98f" stroke="#2b2622" stroke-width="2.5"/>
<text x="460.0" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">bogidadi(公開用)</text>
<text x="460.0" y="158.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">GitHub Pages = 本拠地</text>
<text x="460.0" y="178.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">公開ページ、ゲーム、書庫</text>
